spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.properties.hibernate.default_schema=public
spring.main.lazy-initialization=true

# Logging
logging.level.root=INFO
logging.level.com.uninote.backend=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=WARN

# Server Configuration
server.port=5000
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Azure OpenAI (values come from env)
azure.openai.azureApiKey=${AZURE_OPENAI_AZURE_API_KEY}
azure.openai.azureEndpoint=${AZURE_OPENAI_AZURE_ENDPOINT}
azure.openai.chatDeployment=${AZURE_OPENAI_CHAT_DEPLOYMENT}
azure.openai.embeddingDeployment=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT}

# Encryption
encryption.key=${NOTE_ENCRYPTION_KEY:default-value}

# Mixpanel
mixpanel.project.token=${MIXPANEL_PROJECT_TOKEN}

# Pinecone
pinecone.api-key=${PINECONE_API_KEY}
pinecone.index-url=${PINECONE_INDEX_URL}
pinecone.index-name=${PINECONE_INDEX_NAME}

# Firebase
firebase.config.base64=${FIREBASE_CONFIG_BASE64}
firebase.database.url=${FIREBASE_DATABASE_URL:https://uninote-app-default-rtdb.firebaseio.com}

# Stripe
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
stripe.price.BASIC_ONE_YEAR=${STRIPE_PRICE_BASIC_ONE_YEAR}
stripe.price.BASIC_ONE_MONTH=${STRIPE_PRICE_BASIC_ONE_MONTH}

# CloudConvert
cloudconvert.api.key=${CLOUDCONVERT_API_KEY}

# Langfuse
langfuse.base-url=${LANGFUSE_BASEURL}
langfuse.public-key=${LANGFUSE_PUBLIC_KEY}
langfuse.secret-key=${LANGFUSE_SECRET_KEY}

# Resend
resend.api.key=${RESEND_API_KEY}

# PostHog
posthog.api.key=${POSTHOG_API_KEY}

# Hibernate optimization
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
spring.jpa.properties.hibernate.default_batch_fetch_size=16
spring.jpa.properties.hibernate.max_fetch_depth=3

# Management
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
